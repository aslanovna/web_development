<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>День ломания льда на лужах</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="snow-container">
  <div class="snowflake" style="left: 5%; width: 6px; height: 6px; animation-duration: 3.5s;"></div>
  <div class="snowflake" style="left: 25%; width: 8px; height: 8px; animation-duration: 5s;"></div>
  <div class="snowflake" style="left: 80%; width: 7px; height: 7px; animation-duration: 4.2s;"></div>
  <div class="snowflake" style="left: 12%; width: 9px; height: 9px; animation-duration: 6s;"></div>
  <div class="snowflake" style="left: 60%; width: 5px; height: 5px; animation-duration: 3s;"></div>
  <div class="snowflake" style="left: 95%; width: 10px; height: 10px; animation-duration: 7s;"></div>
  <div class="snowflake" style="left: 35%; width: 6px; height: 6px; animation-duration: 4s;"></div>
  <div class="snowflake" style="left: 70%; width: 8px; height: 8px; animation-duration: 5.5s;"></div>
  <div class="snowflake" style="left: 45%; width: 7px; height: 7px; animation-duration: 4.5s;"></div>
  <div class="snowflake" style="left: 18%; width: 9px; height: 9px; animation-duration: 6.5s;"></div>
  <div class="snowflake" style="left: 88%; width: 6px; height: 6px; animation-duration: 3.2s;"></div>
  <div class="snowflake" style="left: 50%; width: 8px; height: 8px; animation-duration: 5.8s;"></div>
  <div class="snowflake" style="left: 22%; width: 7px; height: 7px; animation-duration: 4.8s;"></div>
  <div class="snowflake" style="left: 65%; width: 9px; height: 9px; animation-duration: 6.2s;"></div>
  <div class="snowflake" style="left: 90%; width: 5px; height: 5px; animation-duration: 3.8s;"></div>
</div>

    <div class="card">
      
      <div class="front">
        <h1>День ломания льда на лужах</h1>
        <h2>8 ноября</h2>
      </div>

      <div class="back">
        <h1>Поздравляем!</h1>
        <h3>Пусть в этот день ломается только лед под ногами, а все твои планы и дела идут как по маслу!</h3>
        <h3> Сегодня официально разрешено громко топать и радоваться хрусту под ногами.</h3>
  </body>
</html>
